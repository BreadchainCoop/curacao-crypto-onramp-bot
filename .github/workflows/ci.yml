name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pnpm first: setup-node's pnpm cache needs the binary on PATH.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Coverage thresholds (enforced by package scripts):
  # - backend/bot: lines 80%, functions 70%, branches 70%
  #   excludes: index.js (entrypoint), test/**
  # - contracts/evm: Escrow.sol lines 80% (mocks/ skipped via .solcover.js)
  # Node 22.8+ is required for --test-coverage-* threshold/exclude flags.
  coverage:
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test:coverage
