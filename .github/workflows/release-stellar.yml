name: release-stellar

# Attested build of the Stellar escrow wasm for StellarExpert source
# verification. Repo prerequisite: Settings -> Actions -> General -> Workflow
# permissions must allow the `id-token`, `contents` and `attestations` writes
# below.

on:
  push:
    tags: ["stellar-escrow-v*"]

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  # Builds an optimized wasm, publishes it as a GitHub release and attests it.
  # Kept to this one job, as StellarExpert documents: runs with a test job stayed
  # unverified. contracts-stellar.yml tests PRs, so only tag commits on main.
  escrow:
    # StellarExpert's documented ref. A build pinned to 6b16426 (the same code)
    # stayed unverified. Upstream can change what gets attested: revisit before mainnet.
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      relative_path: contracts/stellar
      package: escrow
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
